name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (no torch/ml — CI runs the pure-logic tests)
        run: pip install -e "backend[dev,index,text,api]"
      - name: Ruff
        run: ruff check backend/src backend/tests
      - name: Pytest
        # Tests needing the FAISS index / SigLIP model skip automatically in CI.
        run: pytest backend/tests -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
